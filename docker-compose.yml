services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/data:/app/data
    environment:
      LIBRARY_DATA_DIR: /app/data/library
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

  # Nginx Frontend (Web UI)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
